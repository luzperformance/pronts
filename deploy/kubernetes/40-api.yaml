apiVersion: v1
kind: Service
metadata:
  name: primeiro-prontuario-api
  namespace: primeiro-prontuario
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: primeiro-prontuario-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: primeiro-prontuario-api
  namespace: primeiro-prontuario
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: primeiro-prontuario-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: primeiro-prontuario-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: primeiro-prontuario-api:0.0.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
          envFrom:
            - configMapRef:
                name: primeiro-prontuario-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: primeiro-prontuario-credentials
                  key: database-url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: primeiro-prontuario-credentials
                  key: database-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: primeiro-prontuario-credentials
                  key: database-password
            - name: DOCTOR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: primeiro-prontuario-credentials
                  key: doctor-username
            - name: DOCTOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: primeiro-prontuario-credentials
                  key: doctor-password
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: attachments
              mountPath: /var/lib/primeiro-prontuario/attachments
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: primeiro-prontuario-attachments
