apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  namespace: primeiro-prontuario
data:
  10-create-application-roles.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    psql \
      --set=ON_ERROR_STOP=1 \
      --set=migration_username="$MIGRATION_USERNAME" \
      --set=migration_password="$MIGRATION_PASSWORD" \
      --set=runtime_username="$RUNTIME_USERNAME" \
      --set=runtime_password="$RUNTIME_PASSWORD" \
      --username "$POSTGRES_USER" \
      --dbname "$POSTGRES_DB" <<'SQL'
    SELECT format(
      'CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS',
      :'migration_username',
      :'migration_password'
    ) \gexec
    SELECT format(
      'CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS',
      :'runtime_username',
      :'runtime_password'
    ) \gexec

    REVOKE CONNECT, TEMPORARY
    ON DATABASE primeiro_prontuario
    FROM PUBLIC;

    SELECT format(
      'GRANT CONNECT, CREATE ON DATABASE primeiro_prontuario TO %I',
      :'migration_username'
    ) \gexec

    SELECT format(
      'GRANT CONNECT ON DATABASE primeiro_prontuario TO %I',
      :'runtime_username'
    ) \gexec

    REVOKE CREATE
    ON SCHEMA public
    FROM PUBLIC;

    SELECT format(
      'GRANT USAGE, CREATE ON SCHEMA public TO %I',
      :'migration_username'
    ) \gexec

    SELECT format(
      'GRANT USAGE ON SCHEMA public TO %I',
      :'runtime_username'
    ) \gexec

    SELECT format(
      'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public
       GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO %I',
      :'migration_username',
      :'runtime_username'
    ) \gexec

    SELECT format(
      'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public
       GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO %I',
      :'migration_username',
      :'runtime_username'
    ) \gexec
    SQL
